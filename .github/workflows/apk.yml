# Gera o APK Android assinado e publica como "release" no GitHub a cada envio para main.
# O app instalado consulta a última release para avisar que há versão nova.
name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      APP_VERSION_CODE: ${{ github.run_number }}
      APP_VERSION_NAME: 2.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - name: Conferir segredos da chave de assinatura
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$PW" ]; then
            echo "::error::Faltam os segredos ANDROID_KEYSTORE_BASE64 e/ou ANDROID_KEYSTORE_PASSWORD (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          APP_TARGET: android
      - run: npx cap sync android

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Montar e assinar o APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: treino
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/treino.jks"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/treino.jks"
          cd android
          chmod +x gradlew
          set +e
          ./gradlew assembleRelease --no-daemon --console=plain > "$RUNNER_TEMP/gradle.log" 2>&1
          rc=$?
          set -e
          tail -n 80 "$RUNNER_TEMP/gradle.log"
          if [ $rc -ne 0 ]; then
            # mostra as linhas de erro como anotações (visíveis na página da execução, sem login)
            grep -nE "error:|e: |What went wrong|Could not|Execution failed|> .*(failed|error)|FAILURE" "$RUNNER_TEMP/gradle.log" | head -n 9 | while IFS= read -r line; do echo "::error::$line"; done
            grep -A12 "What went wrong" "$RUNNER_TEMP/gradle.log" | tr '\n' ' ' | cut -c1-900 | sed 's/^/::error::/'
            exit $rc
          fi
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/treino.apk"

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION_NAME }}
          name: Treino ${{ env.APP_VERSION_NAME }}
          body: ${{ github.event.head_commit.message }}
          make_latest: true
          files: treino.apk
