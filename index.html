<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f6b63">
<title>Treino</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon-180x180.png">
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 id="hello">Treino</h1>
    <div id="status" aria-live="polite"></div>
  </header>
  <main id="app"><div class="loading">Carregando…</div></main>
</div>

<div id="rest" role="timer" aria-live="off">
  <div class="in">
    <div class="t" id="restT">0:00</div>
    <div class="bar"><i id="restBar"></i></div>
    <button type="button" data-act="rest-add">+30 s</button>
    <button type="button" data-act="rest-stop">Fechar</button>
  </div>
</div>

<div id="modal" role="dialog" aria-modal="true"><div class="sheet" id="sheet"></div></div>

<nav class="tabs" aria-label="Seções" id="tabs">
  <div class="in">
    <button type="button" data-tab="hoje">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Hoje</button>
    <button type="button" data-tab="treinos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Treinos</button>
    <button type="button" data-tab="caminhada">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="4" r="2"/><path d="M10 22l2-7-3-3 1-5 4 3 3 1M9 12l-2 3-3 1"/></svg>Caminhada</button>
    <button type="button" data-tab="evolucao">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18M5 16l4-5 4 3 6-8"/></svg>Evolução</button>
    <button type="button" data-tab="perfil">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Perfil</button>
  </div>
</nav>

<script type="module" src="/src/main.js"></script>
</body>
</html>
